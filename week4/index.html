<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">

 <meta name="viewport"  content="width=device-width,initial-scale=1.0>"
  <meta name="description"content="My College Registration Form">
  <meta name="author"content="Abhishek">

  <title>My College Website</title>
 
   <link rel="icon" type="image/png" href="favicon.png.jpeg">
   </head>
<body>

    <h1>Registration Form</h1>

    <form style="width:400px; min-height:400px; padding: 20px; border:1px solid black;">


        <label for="name">Name:</label>
        <input type="text"id="name"name="name" style="height: 20px;">
        <br><br>


        <label for="email">Email:</label>
        <input type="email"id="email"name="email style="height: 30px;">
        <br><br>

        
        <label for="password">Password:</label>
        <input type="password"id="password"name="password style="height:30px;"">
        <br><br>


        <label>Date:</label>
        <input type="date">
        <br><br>


        <label>Phone:</label>
        <input type="tel">
        <br><br>


        <label>Gender:</label>
        <input type="radio"name="gender">Male
        <input type="radio"name="gender">Female
        <br><br>


        <label>Hobbies:</label>

         <input type="checkbox"name="hobbies">Cricket
         <input type="checkbox"name="hobbies">Music
         <br><br>


         <label for="course">Course:</label>
         <select id="course"name="course">
             <option>B.Tech</option>
             <option>BCA</option>
             <option>M.Tech</option>
             <option>MCA</option>
         </select>
         <br><br>


         <label for="message">Message:</label>
         <br>
         <textarea id="message"name="message" rows="5" cols="30"></textarea>
         <br><br>


         <button type="submit">submit</button>


    </form>

       <h1>College Events</h1>
       <table border="1" cellpadding="10">

       <thead>
        <tr>
        <th>Event Name</th>
        <th>Date</th>
        <th>Venue</th>
        </tr>
       </thead>

       <tbody>
        <tr>
             <td>HTML workshop</td>
             <td>10 November</td>
             <td>Lab 1</td>
        </tr>
             <tr>
                <td>Hackathon</td>
                <td>15 November</td>
                <td>Seminar Hall 2</td>
             </tr>
       </tbody>

       <tfoot>
         <tr>
            <td colspan="3">Total Events:2</td>
         </tr>
       </tfoot>

    </table>
    

</body>
</html>
